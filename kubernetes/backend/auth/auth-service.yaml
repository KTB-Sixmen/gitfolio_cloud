# auth-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gitfolio
  labels:
    app: auth
spec:
  selector:
    app: auth
  type: ClusterIP
  ports:
    - name: http
      port: 80            # 파드가 개방하는 포트
      targetPort: 8080    # 앱이 리스닝하는 포트 
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP