# chat-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: gitfolio-chat-service
  namespace: gitfolio
  labels:
    app: gitfolio-chat
spec:
  selector:
    app: gitfolio-chat
  type: ClusterIP
  ports:
    - port: 8080          # CHAT_SERVER_PORT=8080
      targetPort: 8080
      protocol: TCP
      name: http