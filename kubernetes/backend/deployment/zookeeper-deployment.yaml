apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitfolio-back-zookeeper-deployment
  namespace: gitfolio
  labels:
    app: gitfolio-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitfolio-zookeeper
  template:
    metadata:
      labels:
        app: gitfolio-zookeeper
    spec:
      imagePullSecrets:
        - name: gitfolio-container-registry
      containers:
        - name: gitfolio-zookeeper
          image: zookeeper:3.6
          ports:
            - name: kafka1
              containerPort: 9092
            - name: kafka2
              containerPort: 29092
          envFrom:
            - configMapRef:
                name: gitfolio-back-configmap
            - secretRef:
                name: gitfolio-back-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - gitfolio-zookeeper
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
