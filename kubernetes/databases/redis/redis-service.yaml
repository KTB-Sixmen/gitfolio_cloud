apiVersion: v1
kind: Service
metadata:
  name: gitfolio-redis-auth-service # ConfigMap에 정의된 AUTH_REDIS_HOST와 일치
  namespace: gitfolio
  labels:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: gitfolio-redis
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: gitfolio-redis
    app.kubernetes.io/name: redis
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
    - name: sentinel
      port: 26379
      targetPort: 26379
      protocol: TCP

