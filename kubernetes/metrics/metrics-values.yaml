prometheus:
  enabled: true

  prometheusSpec:  
    serviceMonitorSelectorNilUsesHelmValues: false  
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gitfolio-metrics-sc
          resources:
            requests:
              storage: 30Gi
          accessModes:
            - ReadWriteOnce
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: true
  tls:
    enabled: false
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
    
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gitfolio-metrics-sc
          resources:
            requests:
              storage: 10Gi
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  enabled: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    kubePrometheusNodeRecording: true
    kubernetesAbsent: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    network: true
    node: true
    prometheus: true
    prometheusOperator: true
    time: true

grafana:
  enabled: true
  adminPassword: "gitfolio" # 반드시 변경하세요
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gitfolio-metrics-sc # 클러스터의 스토리지 클래스에 맞게 수정
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
    hosts:
      - grafana.gitfolio.site
    path: /
    pathType: Prefix
  grafana.ini:
    server:
      doamin: grafana.gitfolio.site
      root_url: http://grafana.gitfolio.site
      serve_from_sub_path: false
    
  # 대시보드 프로비저닝 설정
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards

  # 기본 대시보드 설정
  dashboards:
    default:
      kubernetes:
        gnetId: 315
        revision: 2
        datasource: Prometheus