# zookeeper-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: gitfolio
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  type: ClusterIP
  ports:
    - name: zookeeper
      port: 2181          # 파드가 개방하는 포트
      targetPort: 2181    # 앱이 리스닝하는 포트 
      protocol: TCP