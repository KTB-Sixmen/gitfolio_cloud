- name: Configure Kubernetes network
  hosts: helm
  tasks:
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get_helm.sh
        mode: '0700'

    - name: Execute Helm installation script
      shell: |
        /tmp/get_helm.sh
    
    - name: Add helm charts 
      become: no
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.repo_url }}"
      loop: "{{ ansible_helm_charts[:5] }}"

    - name: Deploy Calico System
      become: no
      kubernetes.core.helm:
        kubeconfig: "{{ ansible_home_dir }}/.kube/config"
        name: "{{ ansible_helm_charts[0].name }}"
        chart_ref: "{{ ansible_helm_charts[0].chart_ref }}"
        release_namespace: "{{ ansible_helm_charts[0].namespace }}"
        create_namespace: true

    - name: Create namespace for {{ ansible_helm_charts[2].namespace }}
      kubernetes.core.k8s:
        kubeconfig: "{{ ansible_home_dir }}/.kube/config"
        name: "{{ ansible_helm_charts[2].namespace }}"
        api_version: v1
        kind: Namespace
        state: present
    
    - name: Change default namespace to gitfolio
      shell: |
        kubectl config set-context --current --namespace={{ ansible_helm_charts[2].namespace }}
      environment:
        KUBECONFIG: "{{ ansible_home_dir }}/.kube/config"

    - name: Copy kube config for local use
      copy:
        src: "{{ ansible_home_dir }}/.kube/config"
        dest: "{{ ansible_home_dir }}/.kube/local"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Insert tls certificate skip
      lineinfile:
        path: "{{ ansible_home_dir }}/.kube/local"
        insertafter: "^.*certificate-authority-data:.*"
        line: "    insecure-skip-tls-verify: true"

    - name: Erase certificate authority data
      replace:
        path: "{{ ansible_home_dir }}/.kube/local"
        regexp: "^.*certificate-authority-data:.*"
        replace: '# \g<0>'

    - name: Change kubernetes api server address
      replace:
        path: "{{ ansible_home_dir }}/.kube/local"
        regexp: "10.0.4.5"
        replace: "localhost"

    - name: Copy kubernetes config to local directory
      fetch:
        src: "{{ ansible_home_dir }}/.kube/local"
        dest: ~/.kube/config
        mode: '0600'
        flat: yes

    - name: Delete temp config
      file:
        path: "{{ ansible_home_dir }}/.kube/local"
        state: absent

